spring:
  datasource:
    # MariaDB 기준 드라이버 및 URL 설정
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://192.168.3.10:3306/RabbitMQ?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root  # 아까 GRANT 권한을 준 계정 (예: root)
    password: suhan1004!

  jpa:
    hibernate:
      ddl-auto: update # 개발 환경에서만 사용, 운영 시에는 validate 권장
